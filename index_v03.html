<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <title>Xiaomi Scooter 6 — Inspector v0.3</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; background:#111214; color:#f5f5f7; }
    main { max-width:720px; margin:0 auto; padding:28px 18px 48px; }
    .card { background:#1b1c20; border:1px solid #303138; border-radius:20px; padding:18px; margin:14px 0; }
    h1 { font-size:28px; margin:0 0 6px; }
    p { color:#b8bbc3; line-height:1.45; }
    button { width:100%; min-height:52px; border:0; border-radius:14px; font-size:17px; font-weight:700; margin-top:10px; }
    #connect { background:#f2f2f2; color:#111; }
    #disconnect { background:#2a2b31; color:#fff; }
    .k { color:#9da0a8; font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin-top:14px; }
    .v { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-word; margin-top:6px; }
    #status { font-weight:700; }
    .ok { color:#6ee7a8; }
    .err { color:#ff8585; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:13px; color:#d5d7dd; }
    .char { padding:10px 0; border-bottom:1px solid #303138; }
    .char:last-child { border-bottom:0; }
    .small { color:#b8bbc3; font-size:13px; }
  </style>
</head>
<body>
<main>
  <h1>Xiaomi Scooter 6 — Inspector v0.3</h1>
  <p>Read-only: подключается к FE95, читает 0004 и 001C, затем показывает свойства характеристик. BLE-записей нет.</p>

  <div class="card">
    <div class="k">Статус</div>
    <div id="status">Готов</div>
    <button id="connect">Connect & Inspect</button>
    <button id="disconnect" disabled>Disconnect</button>
  </div>

  <div class="card">
    <div class="k">Устройство</div>
    <div id="device" class="v">—</div>

    <div class="k">0004 ASCII</div>
    <div id="v4ascii" class="v">—</div>
    <div class="k">0004 HEX</div>
    <div id="v4hex" class="v">—</div>

    <div class="k">001C ASCII</div>
    <div id="v1cascii" class="v">—</div>
    <div class="k">001C HEX</div>
    <div id="v1chex" class="v">—</div>
  </div>

  <div class="card">
    <div class="k">FE95 характеристики</div>
    <div id="chars" class="v">—</div>
  </div>

  <div class="card">
    <div class="k">Лог</div>
    <pre id="log">Ожидание…</pre>
  </div>
</main>

<script>
(() => {
  const SERVICE = '0000fe95-0000-1000-8000-00805f9b34fb';
  const UUID4   = '00000004-0000-1000-8000-00805f9b34fb';
  const UUID1C  = '0000001c-0000-1000-8000-00805f9b34fb';
  let device = null;

  const $ = id => document.getElementById(id);
  const log = msg => {
    const now = new Date().toLocaleTimeString();
    $('log').textContent += `\n[${now}] ${msg}`;
  };
  const setStatus = (msg, cls='') => {
    $('status').textContent = msg;
    $('status').className = cls;
  };
  const toHex = bytes => [...bytes].map(b => b.toString(16).padStart(2,'0')).join(' ').toUpperCase();
  const toAscii = bytes => new TextDecoder().decode(bytes).replace(/\0/g, '').replace(/[^\x20-\x7E]/g, '.');
  const shortUuid = u => (u.match(/^0000([0-9a-f]{4})-/i)?.[1] || u).toUpperCase();

  async function readChar(service, uuid, asciiEl, hexEl) {
    try {
      const ch = await service.getCharacteristic(uuid);
      const dv = await ch.readValue();
      const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
      $(hexEl).textContent = toHex(bytes);
      $(asciiEl).textContent = toAscii(bytes) || '(пусто)';
      log(`${shortUuid(uuid)} READ OK: ${toHex(bytes)}`);
    } catch (e) {
      $(hexEl).textContent = `Ошибка: ${e.message || e}`;
      $(asciiEl).textContent = '—';
      log(`${shortUuid(uuid)} READ ERROR: ${e.name || 'Error'} ${e.message || e}`);
    }
  }

  function propsText(p) {
    const props = [
      ['read', p.read],
      ['write', p.write],
      ['writeNoResp', p.writeWithoutResponse],
      ['notify', p.notify],
      ['indicate', p.indicate]
    ];
    return props.filter(x => x[1]).map(x => x[0]).join(', ') || '—';
  }

  $('connect').addEventListener('click', async () => {
    if (!navigator.bluetooth) {
      setStatus('Web Bluetooth недоступен', 'err');
      log('navigator.bluetooth отсутствует. Открой страницу в Bluefy.');
      return;
    }

    try {
      setStatus('Выбор устройства…');
      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE]
      });

      $('device').textContent = device.name || '(без имени)';
      log(`Выбрано: ${device.name || '(без имени)'}`);

      device.addEventListener('gattserverdisconnected', () => {
        setStatus('Отключено');
        $('disconnect').disabled = true;
        $('connect').disabled = false;
        log('GATT отключён');
      });

      setStatus('GATT connect…');
      const server = await device.gatt.connect();
      log('GATT подключён');

      const service = await server.getPrimaryService(SERVICE);
      log('FE95 найден');

      await readChar(service, UUID4, 'v4ascii', 'v4hex');
      await readChar(service, UUID1C, 'v1cascii', 'v1chex');

      try {
        const chars = await service.getCharacteristics();
        const wanted = ['0004','0010','0016','0017','0018','001A','001B','001C'];
        const rows = chars
          .map(ch => ({id: shortUuid(ch.uuid), p: propsText(ch.properties)}))
          .filter(x => wanted.includes(x.id))
          .sort((a,b) => a.id.localeCompare(b.id));

        $('chars').innerHTML = rows.length
          ? rows.map(x => `<div class="char"><b>${x.id}</b><div class="small">${x.p}</div></div>`).join('')
          : 'Нужные характеристики не найдены';

        log(`Найдено характеристик FE95: ${chars.length}`);
      } catch (e) {
        $('chars').textContent = `Ошибка списка: ${e.message || e}`;
        log(`LIST ERROR: ${e.name || 'Error'} ${e.message || e}`);
      }

      setStatus('READ-ONLY INSPECT OK', 'ok');
      $('disconnect').disabled = false;
      $('connect').disabled = true;
    } catch (e) {
      setStatus('Ошибка', 'err');
      log(`${e.name || 'Error'}: ${e.message || e}`);
    }
  });

  $('disconnect').addEventListener('click', () => {
    try { device?.gatt?.disconnect(); } catch (_) {}
  });
})();
</script>
</body>
</html>
